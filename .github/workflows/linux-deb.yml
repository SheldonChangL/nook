# 在原生 x64 的 runner 上，於 Ubuntu 22.04 容器裡測試與建置 Nook 的 amd64 .deb（22.04 是最舊的支援目標；
# 在新版 Ubuntu 上編會讓產出帶著新 glibc 的符號版本需求，裝到舊版就開不起來），檢查套件內容，
# 在乾淨的 ubuntu:22.04 與 ubuntu:24.04 容器裡各只靠套件依賴安裝一次，
# 再連同 SHA256SUMS 上傳成 workflow artifact（要登入 GitHub 才能下載）。
# 觸發方式與權限同 windows-installer.yml：PR、手動、被 release-draft.yml 呼叫；唯讀、不簽章、不發佈。
# 容器安裝不等於實體桌面驗收；互動流程仍要在測試機做（見 CROSS_PLATFORM_INSTALL_PLAN.md）。
name: Linux deb

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'linux/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'SecureManage_UI_Assets/**'
      - '.gitattributes'
      - 'scripts/package_linux.sh'
      - 'scripts/build_linux_container.sh'
      # .deb 的圖示取自 macOS asset catalog（package_linux.sh）。
      - 'macos/Runner/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/linux-deb.yml'
      - '.github/workflows/release-draft.yml'
  workflow_dispatch:
  # release-draft.yml 重用這裡的建置；產物在同一次執行裡交給建立草稿的 job。
  workflow_call:

permissions:
  contents: read

concurrency:
  # 不用 github.workflow：被 release-draft.yml 呼叫時那是呼叫端的名字，兩支建置會搶同一個群組互相取消。
  group: linux-deb-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # runner 本身是 24.04，但建置全程在 22.04 容器裡（linux/packaging/build.Dockerfile）。
      # 第一步會把映像建起來（含 Flutter SDK，約 4–6 分鐘），第二步直接重用。
      # 建置環境與 Flutter 版本都釘在 Dockerfile 裡，本機跑同一支腳本會得到一樣的結果。
      - name: Flutter checks (Ubuntu 22.04 container)
        run: |
          ./scripts/build_linux_container.sh bash -euc '
            flutter --version
            flutter analyze
            flutter test --concurrency=1
          '

      - name: Build and package (Ubuntu 22.04 container)
        run: ./scripts/build_linux_container.sh

      - name: Inspect package and write checksums
        working-directory: dist
        run: |
          ls -l nook_*_amd64.deb
          dpkg-deb --info nook_*_amd64.deb
          contents="$(dpkg-deb --contents nook_*_amd64.deb)"
          for path in ./opt/nook/nook ./opt/nook/data/icudtl.dat ./opt/nook/lib/libapp.so \
              ./usr/bin/nook ./usr/share/applications/tw.com.jetopto.nook.desktop; do
            grep -qF " $path" <<<"$contents" || { echo "套件缺 $path" >&2; exit 1; }
          done
          # libc6 的版本下限是防呆的最後一道：沒有它，在新版 Ubuntu 上編的套件會裝得上舊版
          # 卻開不起來（package_linux.sh 會算出實際需求）。超過 2.35 就表示不是在 22.04 上編的。
          depends="$(dpkg-deb --field nook_*_amd64.deb Depends)"
          grep -qE 'libc6 \(>= 2\.(3[0-5]|[0-2][0-9])\)' <<<"$depends" \
            || { echo "Depends 的 libc6 版本下限不對（超過 22.04 基線或沒寫）：$depends" >&2; exit 1; }
          sha256sum nook_*_amd64.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Install in clean Ubuntu 22.04 and 24.04 containers
        run: |
          # 乾淨容器沒有 Flutter、GTK、EGL、CJK 字型；只靠 .deb 的 Depends 帶進來，
          # 再用 ldd 確認執行檔沒有缺函式庫 —— glibc 符號版本不合時 ldd 也會印
          # 「version `GLIBC_2.xx' not found」，所以 22.04 這輪正是舊版相容性的回歸測試。
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" bash -euo pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /dist/nook_*_amd64.deb
              test -x /opt/nook/nook && test -L /usr/bin/nook
              out="$(ldd /opt/nook/nook 2>&1)"
              if grep -q "not found" <<<"$out"; then grep "not found" <<<"$out"; exit 1; fi
              dpkg -s nook | sed -n "1,/^Depends/p"
            '
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: nook-linux-amd64
          path: |
            dist/nook_*_amd64.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
